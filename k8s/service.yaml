apiVersion: v1
kind: Service
metadata:
  name: upi-fraud-service
  labels:
    app: upi-fraud-app
spec:
  type: NodePort
  selector:
    app: upi-fraud-app
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30080
    - name: metrics
      port: 8000
      targetPort: 8000
      nodePort: 30090
