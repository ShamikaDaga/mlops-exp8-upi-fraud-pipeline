name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install flake8
        run: pip install flake8==7.5.0
      - name: Run flake8
        run: flake8

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -v

  docker-build:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t upi-fraud-app:ci .
      - name: Start container and check health + /metrics
        run: |
          docker run -d --name smoke -p 8501:8501 -p 8000:8000 upi-fraud-app:ci
          for i in $(seq 1 40); do
            curl -sf http://localhost:8501/_stcore/health && break
            sleep 3
          done
          curl -sf http://localhost:8501/_stcore/health
          curl -sf http://localhost:8000/metrics | grep ml_app_up
      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke
